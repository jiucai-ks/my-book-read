<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>浅绿时光 | 个人部落格</title>
    <!-- 柔和风格，无外部依赖，纯原生实现 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 浅绿色马卡龙色系背景：马卡龙浅绿基调，柔和不刺眼 */
            background: linear-gradient(145deg, #d4f1e9 0%, #b9e4d3 100%);
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            padding: 32px 24px;
            color: #2c3e2f;
        }

        /* 整体布局容器: 左侧导航 + 中央内容区 并排 */
        .blog-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            position: relative;
            backdrop-filter: blur(0px);
        }

        /* ========= 左侧导航栏：奶白色半透明 ========= */
        .nav-sidebar {
            flex: 0 0 260px;
            background: rgba(255, 248, 235, 0.75);   /* 奶白色基调，半透明 */
            backdrop-filter: blur(12px);
            border-radius: 36px;
            padding: 2rem 1.5rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1), 0 1px 2px rgba(255,255,240,0.6) inset;
            border: 1px solid rgba(255, 252, 240, 0.7);
            height: fit-content;
            position: sticky;
            top: 32px;
            transition: all 0.2s ease;
        }

        /* 导航菜单列表 */
        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .nav-item {
            width: 100%;
        }

        .nav-link {
            display: block;
            font-size: 1.5rem;
            font-weight: 500;
            text-decoration: none;
            color: #3b5c3e;
            padding: 0.6rem 1rem;
            border-radius: 60px;
            transition: all 0.25s ease;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            background: rgba(255, 250, 240, 0.3);
            text-align: center;
            font-family: inherit;
        }

        /* 导航悬停效果 */
        .nav-link:hover {
            background: rgba(255, 248, 225, 0.9);
            color: #2a6b4e;
            transform: translateX(4px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* 当前页面高亮（简单用js动态添加类，这里可以不用，但为了美观加个active示例，不过用户可交互）
           默认只做样式，后续点击切换高亮用纯前端模拟单页? 既然要求部落格主要部分内容，采用伪静态展示首页/关于/分类。
           为了简单且优雅，点击导航通过js切换中央区域内容。保留部落格感觉。 */
        .nav-link.active {
            background: #f8f0e0dd;
            color: #2c7a5a;
            font-weight: 600;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
            border-left: 4px solid #86c8a8;
        }

        /* 部落格中央主要区域 */
        .blog-main {
            flex: 1;
            min-width: 260px;
            background: rgba(253, 252, 245, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 2rem 2rem 2.5rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255, 250, 235, 0.7);
            transition: all 0.2s;
        }

        /* 文章卡片样式 / 内容样式 */
        .content-pane {
            animation: fadeIn 0.35s ease-out;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(8px);}
            100% { opacity: 1; transform: translateY(0);}
        }

        /* 部落格标题区 */
        .blog-header {
            margin-bottom: 2rem;
            border-bottom: 2px dashed #bfdec5;
            padding-bottom: 0.8rem;
        }

        .blog-header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            color: #3b6e4a;
            letter-spacing: -0.3px;
            display: inline-block;
            background: linear-gradient(135deg, #457b5a, #6aa97e);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .blog-header p {
            color: #5d7a62;
            margin-top: 8px;
            font-size: 1rem;
        }

        /* 卡片列表布局（主页与分类通用） */
        .posts-grid {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .post-card {
            background: rgba(255, 254, 250, 0.85);
            border-radius: 32px;
            padding: 1.5rem 2rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(190, 222, 170, 0.5);
        }

        .post-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 250, 0.95);
            box-shadow: 0 18px 28px -12px rgba(82, 112, 84, 0.2);
        }

        .post-title {
            font-size: 1.7rem;
            font-weight: 600;
            color: #2a6742;
            margin-bottom: 0.5rem;
        }

        .post-meta {
            font-size: 0.85rem;
            color: #8aa389;
            margin-bottom: 0.9rem;
            display: flex;
            gap: 1rem;
        }

        .post-excerpt {
            color: #3c5a42;
            line-height: 1.5;
            font-size: 1rem;
        }

        .tag {
            display: inline-block;
            background: #d9f0e2;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-size: 0.75rem;
            color: #3b764e;
            margin-right: 0.6rem;
        }

        /* 关于页面 专属样式 */
        .about-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .about-avatar {
            width: 100px;
            height: 100px;
            background: #cbe5d4;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 0 8px 18px rgba(0,0,0,0.05);
            margin-bottom: 0.5rem;
        }

        .about-text {
            background: rgba(240, 250, 240, 0.7);
            padding: 1.5rem;
            border-radius: 32px;
            line-height: 1.7;
        }

        /* 分类页面里的分类标签云风格 */
        .categories-list {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .category-chip {
            background: rgba(205, 225, 190, 0.7);
            padding: 0.6rem 1.4rem;
            border-radius: 60px;
            font-weight: 500;
            color: #2c6a3e;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
        }

        .category-chip:hover, .category-chip.active-cat {
            background: #9fd0ae;
            color: #fff3e0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* 响应式：小屏幕时左侧导航不再 sticky，改为水平排列或顶部导航 */
        @media (max-width: 780px) {
            body {
                padding: 20px 16px;
            }
            .blog-container {
                flex-direction: column;
            }
            .nav-sidebar {
                flex: auto;
                position: static;
                width: 100%;
                text-align: center;
                backdrop-filter: blur(16px);
                padding: 1rem 1rem;
            }
            .nav-menu {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.8rem;
            }
            .nav-link {
                font-size: 1.2rem;
                padding: 0.4rem 1rem;
            }
            .blog-main {
                padding: 1.5rem;
            }
            .post-title {
                font-size: 1.4rem;
            }
        }

        /* 装饰小元素 */
        .leaf-icon {
            font-size: 0.9rem;
            display: inline-block;
            margin-right: 4px;
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #678e6e;
            border-top: 1px solid #cae1ce;
            padding-top: 1.2rem;
        }
    </style>
</head>
<body>

<div class="blog-container">
    <!-- 左侧奶白色半透明导航栏 -->
    <aside class="nav-sidebar">
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="#" class="nav-link" data-page="home">🏡 主页</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" data-page="about">📖 关于</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" data-page="categories">🏷️ 分类</a>
            </li>
        </ul>
        <!-- 增加一点可爱的小装饰 -->
        <div style="margin-top: 2rem; text-align:center; opacity:0.6; font-size:0.75rem;">
            <span>🍃 浅绿时光</span>
        </div>
    </aside>

    <!-- 中央部落格主要内容 -->
    <main class="blog-main" id="blogMain">
        <!-- 动态内容会渲染在此处 -->
        <div id="dynamicContent" class="content-pane">
            <!-- 默认载入主页内容 -->
        </div>
        <footer>
            🌱 记录日常灵感 · 慢享生活之美
        </footer>
    </main>
</div>

<script>
    // 定义部落格数据 (文章用于主页及分类展示)
    const postsData = [
        {
            id: 1,
            title: "初夏的风与马卡龙梦境",
            date: "2026年5月2日",
            category: "生活随笔",
            excerpt: "浅绿色的午后，空气里漂浮着薄荷香气。坐在窗边，敲下第一行字，愿每一刻都像马卡龙一样柔软。",
            tags: ["治愈", "日常"]
        },
        {
            id: 2,
            title: "设计日记：奶白色与半透明的平衡感",
            date: "2026年4月28日",
            category: "设计灵感",
            excerpt: "半透明导航栏如何营造轻盈感？今天分享关于朦胧UI和自然色系的搭配心得与一个小技巧。",
            tags: ["UI设计", "前端美学"]
        },
        {
            id: 3,
            title: "森系读书笔记：《瓦尔登湖》节选",
            date: "2026年4月20日",
            category: "阅读",
            excerpt: "‘我愿深扎入生活，吮尽生命的骨髓。’ 慢下来，在字里行间找到宁静的角落，推荐给所有向往自然的朋友。",
            tags: ["读书", "哲思"]
        },
        {
            id: 4,
            title: "如何用 CSS 打造玻璃拟态导航栏",
            date: "2026年4月12日",
            category: "技术分享",
            excerpt: "backdrop-filter 和半透明背景的结合，只需几行代码就能营造出柔和、现代的视觉风格。附赠配色方案。",
            tags: ["CSS", "前端"]
        },
        {
            id: 5,
            title: "马卡龙色系调色盘灵感集",
            date: "2026年4月5日",
            category: "设计灵感",
            excerpt: "收集了10组低饱和度治愈色值，让你的设计甜而不腻。浅绿、樱花粉、奶油白……",
            tags: ["色彩美学", "设计"]
        },
        {
            id: 6,
            title: "与友人漫步植物园",
            date: "2026年3月28日",
            category: "生活随笔",
            excerpt: "阳光透过绿叶，斑驳洒在小径上。和朋友聊起未来与梦想，记录这份轻快的春天记忆。",
            tags: ["生活", "随想"]
        }
    ];

    // 获取所有分类 (去重)
    function getAllCategories() {
        const cats = postsData.map(post => post.category);
        return [...new Set(cats)];
    }

    // 根据分类过滤文章
    function getPostsByCategory(category) {
        if (!category || category === '全部') return postsData;
        return postsData.filter(post => post.category === category);
    }

    // ---------- 渲染主页 (显示全部文章列表) ----------
    function renderHome() {
        return `
            <div class="blog-header">
                <h1>✨ 浅绿拾光录</h1>
                <p>记录灵感，沉淀柔软时光</p>
            </div>
            <div class="posts-grid">
                ${postsData.map(post => `
                    <article class="post-card">
                        <h2 class="post-title">${escapeHtml(post.title)}</h2>
                        <div class="post-meta">
                            <span>📅 ${escapeHtml(post.date)}</span>
                            <span>🏷️ ${escapeHtml(post.category)}</span>
                        </div>
                        <p class="post-excerpt">${escapeHtml(post.excerpt)}</p>
                        <div style="margin-top:12px">
                            ${post.tags.map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('')}
                        </div>
                    </article>
                `).join('')}
            </div>
        `;
    }

    // ---------- 关于页面 ----------
    function renderAbout() {
        return `
            <div class="blog-header">
                <h1>📖 关于我 & 部落格</h1>
                <p>温柔的力量，生长于日常</p>
            </div>
            <div class="about-section">
                <div class="about-avatar">
                    🌿
                </div>
                <div class="about-text">
                    <p>你好，我是小绿。一个热爱自然、设计与文字的创作者。</p>
                    <p style="margin-top: 1rem;">🍃 这个部落格建立于2026年初夏，我希望用马卡龙般治愈的视觉与真诚的文字，分享生活中的设计、阅读、旅途与细微感动。半透明导航栏正如我内心通透的向往——柔和但有边界，留白处皆有呼吸。</p>
                    <p style="margin-top: 1rem;">📌 在这里你会找到：前端美学 / 书籍推荐 / 日常随想 / 色彩笔记。感谢你的到访，愿光与绿意常伴你左右。</p>
                    <p style="margin-top: 1rem;">✉️ 联络: hello@pastelgreen.me (示意邮箱) </p>
                </div>
                <div style="background: #e6f4e8; border-radius: 28px; padding: 1rem; text-align:center; margin-top: 0.5rem;">
                    🌟 “做自己生活的诗人，用浅绿描绘每一天。”
                </div>
            </div>
        `;
    }

    // 分类页面（默认展示所有文章分类筛选）
    let currentSelectedCategory = "全部";
    
    function renderCategories() {
        const allCategories = getAllCategories();
        const filteredPosts = getPostsByCategory(currentSelectedCategory === "全部" ? null : currentSelectedCategory);
        
        // 动态生成分类标签HTML
        const categoriesHtml = `
            <div class="blog-header">
                <h1>📂 文章分类</h1>
                <p>按分类探索 · 品读慢时光</p>
            </div>
            <div class="categories-list">
                <span class="category-chip ${currentSelectedCategory === "全部" ? 'active-cat' : ''}" data-cat="全部">📌 全部</span>
                ${allCategories.map(cat => `
                    <span class="category-chip ${currentSelectedCategory === cat ? 'active-cat' : ''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</span>
                `).join('')}
            </div>
            <div class="posts-grid" id="categoryPostsContainer">
                ${filteredPosts.length === 0 ? `<div style="padding: 2rem; text-align:center; background: #f8faf0; border-radius: 2rem;">✨ 这个分类下还没有文章，期待未来的灵感～</div>` : 
                    filteredPosts.map(post => `
                        <article class="post-card">
                            <h2 class="post-title">${escapeHtml(post.title)}</h2>
                            <div class="post-meta">
                                <span>📅 ${escapeHtml(post.date)}</span>
                                <span>🏷️ ${escapeHtml(post.category)}</span>
                            </div>
                            <p class="post-excerpt">${escapeHtml(post.excerpt)}</p>
                            <div style="margin-top:12px">
                                ${post.tags.map(tag => `<span class="tag">#${escapeHtml(tag)}</span>`).join('')}
                            </div>
                        </article>
                    `).join('')
                }
            </div>
        `;
        
        // 为了给分类chip绑定事件，返回HTML字符串后，等待内容渲染完毕添加事件委托
        return categoriesHtml;
    }
    
    // 简单的防XSS辅助
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 页面状态管理 & 高亮导航栏
    let currentPage = 'home'; // home, about, categories

    // 渲染主内容并绑定分类页面的动态事件
    function renderPage(page) {
        const contentDiv = document.getElementById('dynamicContent');
        let html = '';
        if (page === 'home') {
            html = renderHome();
        } else if (page === 'about') {
            html = renderAbout();
        } else if (page === 'categories') {
            html = renderCategories();
        }
        contentDiv.innerHTML = html;
        currentPage = page;
        
        // 高亮当前导航菜单
        document.querySelectorAll('.nav-link').forEach(link => {
            const pageVal = link.getAttribute('data-page');
            if ((pageVal === 'home' && page === 'home') ||
                (pageVal === 'about' && page === 'about') ||
                (pageVal === 'categories' && page === 'categories')) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
        
        // 如果当前是分类页面，需要绑定分类筛选按钮点击事件 (事件委托方式或者主动绑定)
        if (page === 'categories') {
            // 绑定分类chip的事件，因为chip是动态生成的，使用事件委托到#dynamicContent上（或者直接在父级监听）
            const container = document.getElementById('dynamicContent');
            // 先移除原有的监听器避免重复绑定, 使用新的事件监听方式 (但可以使用once或每次重新挂载)
            // 直接使用全局委托监听，但避免多个重复，可用命名函数，但最简单重新绑定。
            // 移除原先的委托（如果有储存旧监听器，简单起见只添加一个新监听, 但可能多个，但无伤大雅，使用命名函数并先移除）
            if (window._categoryListener) {
                container.removeEventListener('click', window._categoryListener);
            }
            const categoryHandler = (e) => {
                // 获取实际点击的分类chip
                let target = e.target.closest('.category-chip');
                if (!target) return;
                const catValue = target.getAttribute('data-cat');
                if (catValue) {
                    currentSelectedCategory = catValue;
                    // 重新渲染分类页面但保留选中的分类状态
                    const newHtml = renderCategories();
                    contentDiv.innerHTML = newHtml;
                    // 重新绑定高亮效果: 再次绑定事件, 递归调用会导致自身又被删除监听？ 需要重新绑定监听。
                    // 重新绑定新的监听器（因为innerHTML后dom更新了）
                    attachCategoryEvents(contentDiv);
                    // 同时还要保持导航高亮
                    document.querySelectorAll('.nav-link').forEach(link => {
                        const pageVal = link.getAttribute('data-page');
                        if (pageVal === 'categories') link.classList.add('active');
                        else link.classList.remove('active');
                    });
                    // 滚动到顶部一点小优化
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
            window._categoryListener = categoryHandler;
            container.addEventListener('click', window._categoryListener);
        } else {
            // 如果不是分类页面，移除分类监听器避免冲突
            if (window._categoryListener) {
                const container = document.getElementById('dynamicContent');
                if (container) container.removeEventListener('click', window._categoryListener);
                window._categoryListener = null;
            }
        }
    }
    
    // 辅助函数，为分类页面重新绑定事件（在分类内部筛选点击后再次调用）
    function attachCategoryEvents(container) {
        if (!container) return;
        if (window._categoryListener) {
            container.removeEventListener('click', window._categoryListener);
        }
        const categoryHandler = (e) => {
            let target = e.target.closest('.category-chip');
            if (!target) return;
            const catValue = target.getAttribute('data-cat');
            if (catValue) {
                currentSelectedCategory = catValue;
                const newHtml = renderCategories();
                container.innerHTML = newHtml;
                attachCategoryEvents(container);
                // 重新高亮导航栏（分类页面状态）
                document.querySelectorAll('.nav-link').forEach(link => {
                    const pageVal = link.getAttribute('data-page');
                    if (pageVal === 'categories') link.classList.add('active');
                    else link.classList.remove('active');
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };
        window._categoryListener = categoryHandler;
        container.addEventListener('click', window._categoryListener);
    }
    
    // 导航点击处理
    function setupNavigation() {
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.getAttribute('data-page');
                if (page === 'home') {
                    currentSelectedCategory = "全部"; // 重置分类筛选状态
                    renderPage('home');
                } else if (page === 'about') {
                    renderPage('about');
                } else if (page === 'categories') {
                    currentSelectedCategory = "全部"; // 重置分类筛选到全部
                    renderPage('categories');
                }
                // 可选滚动到顶部
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    }
    
    // 初始加载默认展示主页
    function init() {
        setupNavigation();
        renderPage('home'); // 主页初始
    }
    
    init();
</script>
</body>
</html>
